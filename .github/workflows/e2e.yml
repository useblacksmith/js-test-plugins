name: E2E

# Each plugin as npm would install it, run on the shared scenarios against
# this job's real Actions cache. The CI workflow runs the same scenarios from
# source against a fake cache. With the packed plugin they also include a
# workspace installed by pnpm itself.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    strategy:
      fail-fast: false
      matrix:
        plugin: [vitest, mocha, jest]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable   # pnpm, at the version package.json pins
      - run: pnpm install --frozen-lockfile
      - name: Pack the plugin
        id: pack
        working-directory: packages/${{ matrix.plugin }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/tarball"
          # Fails the step when nothing was packed: an empty path would run the source instead.
          tarball=$(ls "$RUNNER_TEMP"/tarball/*.tgz)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Run the scenarios against the real Actions cache
        working-directory: packages/${{ matrix.plugin }}
        env:
          BLACKSMITH_E2E_CACHE: real
          BLACKSMITH_E2E_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pnpm run test:e2e
