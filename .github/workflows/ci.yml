name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable   # pnpm, at the version package.json pins
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @useblacksmith/vitest exec playwright install --with-deps chromium
      - run: pnpm run check:types
      - run: pnpm run build
      - run: pnpm test
