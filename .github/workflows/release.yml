name: Release

# Stages one package on npm when a <package>-v<version> tag is pushed
# (vitest-v0.6.5, mocha-v0.1.0, jest-v0.2.0-rc1); a maintainer then reviews and releases it
# with `npm stage approve <id>` (2FA prompt). The tag must match the
# package's package.json, and a version already on the registry is never
# republished. Uses npm trusted publishing (OIDC), so no token is stored; each
# package's trusted publisher must point at this repo and workflow file.
on:
  push:
    tags:
      - "vitest-v*"
      - "mocha-v*"
      - "jest-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # GitHub-hosted on purpose: npm generates provenance attestations only on
    # GitHub-hosted runners (RUNNER_ENVIRONMENT=github-hosted) and refuses
    # otherwise. CI (ci.yml) stays on Blacksmith.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: corepack enable   # pnpm, at the version package.json pins
      - run: pnpm install --frozen-lockfile
      - name: Pick the package the tag names
        run: echo "PACKAGE=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_ENV"
      - if: env.PACKAGE == 'vitest'
        run: pnpm --filter @useblacksmith/vitest exec playwright install --with-deps chromium
      - run: pnpm --filter "./packages/${PACKAGE}" --filter ./packages/shared run check:types
      - run: pnpm --filter "./packages/${PACKAGE}" run test
      - name: Check the tag against package.json and the registry
        working-directory: packages/${{ env.PACKAGE }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "${PACKAGE}-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${name} version ${version}" >&2
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published" >&2
            exit 1
          fi
      # A release candidate goes under the dist-tag `rc`: `latest`, which a plain
      # install and version ranges resolve, stays on the last production release.
      - name: Pick the dist-tag
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc[0-9]*) echo "DIST_TAG=rc" >> "$GITHUB_ENV" ;;
            *) echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - run: npm stage publish --provenance --access public --tag "$DIST_TAG"   # prepack runs the build
        working-directory: packages/${{ env.PACKAGE }}
